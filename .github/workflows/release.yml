name: Release xer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xer-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SPARKLE_VERSION: 2.9.5

jobs:
  release:
    name: Build and publish
    runs-on: [self-hosted, macOS, ARM64, xer-release]
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --quiet
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          [[ "$(git rev-parse HEAD)" == "$TAG_COMMIT" ]]
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          }

      - name: Check local release prerequisites
        shell: bash
        env:
          NOTARY_PROFILE: xer-notary
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          XER_WEB_REPO_TOKEN: ${{ secrets.XER_WEB_REPO_TOKEN }}
        run: |
          set -euo pipefail
          command -v xcodebuild
          command -v xcrun
          command -v hdiutil
          command -v gh
          command -v plutil
          test -n "$SIGNING_IDENTITY"
          test -n "$SPARKLE_PRIVATE_KEY"
          test -n "$XER_WEB_REPO_TOKEN"
          security find-identity -v -p codesigning | grep -F "$SIGNING_IDENTITY"
          xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" >/dev/null

      - name: Build, sign, notarize, and package xer
        shell: bash
        env:
          NOTARY_PROFILE: xer-notary
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/build-release.sh "$RELEASE_TAG" "$GITHUB_RUN_NUMBER"

      - name: Create or update GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE="$GITHUB_WORKSPACE/dist/release-notes.md"
          MANUAL_NOTES_FILE="$GITHUB_WORKSPACE/docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$MANUAL_NOTES_FILE" ]]; then
            cp "$MANUAL_NOTES_FILE" "$NOTES_FILE"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              --jq .body > "$NOTES_FILE"
          fi
          test -s "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/xer.dmg \
              dist/xer.app.zip \
              dist/xer-dSYMs.zip \
              dist/SHA256SUMS \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "xer $VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              dist/xer.dmg \
              dist/xer.app.zip \
              dist/xer-dSYMs.zip \
              dist/SHA256SUMS \
              --draft \
              --verify-tag \
              --title "xer $VERSION" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Check out the update feed repository
        uses: actions/checkout@v4
        with:
          repository: anuzsubedi/xer-web
          token: ${{ secrets.XER_WEB_REPO_TOKEN }}
          ref: main
          path: xer-web-update-feed

      - name: Generate signed Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TOOL_ROOT="$RUNNER_TEMP/sparkle-$SPARKLE_VERSION"
          ARCHIVE="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          UPDATES="$RUNNER_TEMP/xer-sparkle-updates"
          mkdir -p "$UPDATES"

          curl --fail --silent --show-error --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            --output "$ARCHIVE"
          mkdir -p "$TOOL_ROOT"
          tar -xJf "$ARCHIVE" -C "$TOOL_ROOT"

          cp xer-web-update-feed/public/appcast.xml "$UPDATES/appcast.xml"
          cp dist/xer.app.zip "$UPDATES/xer.app.zip"

          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | \
            "$TOOL_ROOT/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/anuzsubedi/xer/releases/download/$RELEASE_TAG/" \
              "$UPDATES"

          test -s "$UPDATES/appcast.xml"
          grep -q 'sparkle:edSignature=' "$UPDATES/appcast.xml"
          cp "$UPDATES/appcast.xml" xer-web-update-feed/public/appcast.xml

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Publish signed Sparkle appcast
        shell: bash
        working-directory: xer-web-update-feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast is already current."
            exit 0
          fi
          git commit -m "chore: publish xer $RELEASE_TAG update feed"
          git push origin HEAD:main

      - name: Remove draft release after a failed release
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag=false
          fi

      - name: Clean release workspace
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/xer-release-${GITHUB_RUN_ID}" "$GITHUB_WORKSPACE/dist"
